  # ============================================================================
  #  CLI pool management endpoints (v2.0.0)
  # ============================================================================

  /cli/start:
    post:
      tags: [cli]
      summary: Start a named CLI agent
      description: |
        Starts a specific CLI agent session from the pool. Each agent type
        (`general`, `code`, `complex`) loads its own system prompt from
        `.agents/{name}/system.md` and runs in an isolated Claude CLI process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  enum: [general, code, complex]
                  description: CLI agent name to start
                cwd:
                  type: string
                  description: Working directory for the CLI process (defaults to DEFAULT_CWD)
      responses:
        "200":
          description: CLI agent started successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok, name, sessionId, status]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  name:
                    type: string
                    description: CLI agent name
                  sessionId:
                    type: string
                    description: Claude CLI session ID assigned to this agent
                  status:
                    type: string
                    description: Current status of the CLI agent
        "400":
          description: Invalid or missing CLI name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: CLI start failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cli/send:
    post:
      tags: [cli]
      summary: Send a message to a named CLI agent
      description: |
        Sends a message to a specific CLI agent and waits for the full response.
        If the target CLI is not currently running, it will be started automatically
        (lazy initialization) before the message is delivered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, message]
              properties:
                name:
                  type: string
                  enum: [general, code, complex]
                  description: CLI agent name to send the message to
                message:
                  type: string
                  description: Message to send to the CLI agent
                timeout:
                  type: integer
                  description: |
                    Timeout in milliseconds. Defaults to LEAD_TIMEOUT env var
                    (default 300s). The CLI will be killed if it does not respond
                    within this period.
      responses:
        "200":
          description: Message sent and response received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSendResponse"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Send failed (or lazy-start failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: CLI execution timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cli/stop:
    post:
      tags: [cli]
      summary: Stop a named CLI agent
      description: |
        Stops a specific CLI agent session. The underlying Claude CLI process
        is terminated and the session is removed from the pool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  enum: [general, code, complex]
                  description: CLI agent name to stop
      responses:
        "200":
          description: CLI agent stopped
          content:
            application/json:
              schema:
                type: object
                required: [ok, name, stopped]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  name:
                    type: string
                    description: CLI agent name
                  stopped:
                    type: boolean
                    enum: [true]
                    description: Confirmation that the CLI was stopped
        "400":
          description: Invalid or missing CLI name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cli/{name}/status:
    get:
      tags: [cli]
      summary: Get status of a specific CLI agent
      description: |
        Returns detailed status information for a single CLI agent, including
        its session ID, lifecycle status, working directory, and timestamps.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [general, code, complex]
          description: CLI agent name
      responses:
        "200":
          description: CLI agent status retrieved
          content:
            application/json:
              schema:
                type: object
                required: [ok, cli]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  cli:
                    $ref: "#/components/schemas/CliInfo"
        "400":
          description: Invalid CLI name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CLI agent not found (has not been started)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cli/list:
    get:
      tags: [cli]
      summary: List all CLI agents in the pool
      description: |
        Returns a list of all CLI agent sessions currently registered in the
        pool, regardless of their lifecycle status.
      responses:
        "200":
          description: CLI agent list retrieved
          content:
            application/json:
              schema:
                type: object
                required: [ok, clis]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  clis:
                    type: array
                    items:
                      $ref: "#/components/schemas/CliInfo"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================================
  #  Task and Lead endpoints (backward-compatible, delegate to general CLI)
  # ============================================================================

  /task/submit:
    post:
      tags: [task]
      summary: Submit a task to the Lead Agent
      description: |
        Submits a task message to the Lead Agent for execution. Internally, this
        endpoint delegates to the `general` CLI in the pool. If the general CLI
        is not running, it will be lazily initialized. If the general CLI has
        previously crashed, the endpoint returns 503 until it is restarted via
        `/lead/restart`.

        Timeout protection is applied: if the CLI does not respond within the
        configured timeout, a 504 is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: Task message to send to the Lead Agent
                cwd:
                  type: string
                  description: Working directory (defaults to DEFAULT_CWD)
                timeout:
                  type: integer
                  description: |
                    Timeout in milliseconds. Defaults to LEAD_TIMEOUT env var
                    (default 300s).
      responses:
        "200":
          description: Task submitted and response received
          content:
            application/json:
              schema:
                type: object
                required: [ok, response]
                properties:
                  ok:
                    type: boolean
                  response:
                    type: string
                    description: Claude's response text
                  taskId:
                    type: string
                    nullable: true
                    description: Task ID extracted from the response, or the session ID
                  usage:
                    type: object
                    nullable: true
                    description: Token usage information
        "400":
          description: Missing required parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Task submission failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Lead Agent has crashed and needs restart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Task execution timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /task/{taskId}/status:
    get:
      tags: [task]
      summary: Get status of a specific task
      description: |
        Returns the status and details of a task by its ID. Reads from the
        `.tasks/task_{id}.json` file on disk.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID
      responses:
        "200":
          description: Task status retrieved
          content:
            application/json:
              schema:
                type: object
                required: [ok, task]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  task:
                    type: object
                    description: Task details (structure depends on task-store implementation)
        "400":
          description: Missing task ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tasks/list:
    get:
      tags: [task]
      summary: List all tasks
      description: |
        Returns a list of all tasks from the `.tasks/` directory on disk.
        Each entry includes summary fields: id, title, status, assignee, updated.
      responses:
        "200":
          description: Task list retrieved
          content:
            application/json:
              schema:
                type: object
                required: [ok, tasks]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  tasks:
                    type: array
                    items:
                      type: object
                      description: Task summary object
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to list tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /task/{taskId}/cancel:
    post:
      tags: [task]
      summary: Cancel a running task (Not Implemented)
      description: |
        **Not yet implemented.** Returns 501. Reserved for future task
        cancellation functionality.
      deprecated: true
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          description: Task ID to cancel
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "501":
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Missing task ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lead/status:
    get:
      tags: [lead]
      summary: Get Lead Agent status
      description: |
        Returns the full status of the Lead Agent, which is internally backed
        by the `general` CLI in the pool. Includes whether the agent is alive,
        its session ID, timestamps, and crash information if applicable.
      responses:
        "200":
          description: Lead Agent status retrieved
          content:
            application/json:
              schema:
                type: object
                required: [ok, alive]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  alive:
                    type: boolean
                    description: Whether the general CLI is currently running
                  sessionId:
                    type: string
                    nullable: true
                    description: Claude CLI session ID of the general CLI
                  startedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the general CLI was started
                  lastActivity:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp of the most recent interaction
                  crashInfo:
                    type: object
                    nullable: true
                    description: Crash details, or null if the agent has not crashed
                    properties:
                      exitCode:
                        type: integer
                        nullable: true
                      signal:
                        type: string
                        nullable: true
                      crashedAt:
                        type: string
                        format: date-time
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lead/restart:
    post:
      tags: [lead]
      summary: Restart the Lead Agent
      description: |
        Restarts the Lead Agent (general CLI). If a `sessionId` is provided,
        attempts to restore the existing Claude CLI session. Otherwise, stops
        the current general CLI (if running) and starts a fresh session.
        Clears any crash info on success.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  description: |
                    Optional Claude CLI session ID to restore. If provided, the
                    server attempts session restoration instead of a cold restart.
                cwd:
                  type: string
                  description: Working directory (defaults to DEFAULT_CWD)
      responses:
        "200":
          description: Lead Agent restarted (or restored) successfully
          content:
            application/json:
              schema:
                type: object
                required: [ok, sessionId, restored]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  sessionId:
                    type: string
                    description: Claude CLI session ID of the restarted general CLI
                  restored:
                    type: boolean
                    description: True if an existing session was restored, false if a new session was created
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Restart (or restore) failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ============================================================================
  #  Tool endpoints
  # ============================================================================

  /bash:
    post:
      tags: [tools]
      summary: Execute a bash command
      description: |
        Executes an arbitrary bash command on the server. Subject to security
        controls:
        - Disabled entirely when `BASH_DISABLED=true` (returns 403).
        - Hard-coded blacklist blocks destructive patterns (rm -rf /, mkfs, etc.).
        - Optional whitelist via `BASH_ALLOWED_COMMANDS` env var restricts
          which commands can be executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  description: The bash command to execute
      responses:
        "200":
          description: Command executed (may still have non-zero exit code)
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  result:
                    type: object
                    required: [stdout, stderr]
                    properties:
                      stdout:
                        type: string
                        description: Standard output
                      stderr:
                        type: string
                        description: Standard error
        "400":
          description: Missing required parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Command not allowed (blacklisted, whitelisted, or bash disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Command execution failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /read:
    post:
      tags: [tools]
      summary: Read a file
      description: Reads the contents of a file at the given absolute path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_path]
              properties:
                file_path:
                  type: string
                  description: Absolute path to the file to read
      responses:
        "200":
          description: File content retrieved
          content:
            application/json:
              schema:
                type: object
                required: [ok, result]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  result:
                    type: object
                    required: [type, file]
                    properties:
                      type:
                        type: string
                        enum: [file]
                      file:
                        type: object
                        required: [content]
                        properties:
                          content:
                            type: string
                            description: File content as UTF-8 string
        "400":
          description: Missing required parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: File read failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /call:
    post:
      tags: [tools]
      summary: Execute a tool directly
      description: |
        Executes a supported tool (Glob, Grep, or Read) directly via shell
        commands, without going through a Claude CLI session. Unsupported tools
        return 501.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool]
              properties:
                tool:
                  type: string
                  enum: [Glob, Grep, Read]
                  description: Tool name to execute
                args:
                  type: object
                  description: |
                    Tool-specific arguments:

                    **Glob**: `{ pattern: string, path?: string }`
                    - pattern: glob pattern (e.g. "*.js", "src/**/*.ts")
                    - path: base directory (defaults to DEFAULT_CWD)

                    **Grep**: `{ pattern: string, path?: string, glob?: string, output_mode?: "content" }`
                    - pattern: search pattern
                    - path: directory to search (defaults to DEFAULT_CWD)
                    - glob: file glob filter (e.g. "*.js")
                    - output_mode: "content" for full matches, otherwise filenames only

                    **Read**: `{ file_path: string }`
                    - file_path: absolute path to the file
      responses:
        "200":
          description: Tool executed successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Glob or Grep result
                    required: [ok, result]
                    properties:
                      ok:
                        type: boolean
                        enum: [true]
                      result:
                        type: object
                        properties:
                          filenames:
                            type: array
                            items:
                              type: string
                            description: List of matching file paths
                          content:
                            type: string
                            description: Raw stdout from the command
                  - type: object
                    description: Read result
                    required: [ok, result]
                    properties:
                      ok:
                        type: boolean
                        enum: [true]
                      result:
                        type: object
                        properties:
                          type:
                            type: string
                            enum: [file]
                          file:
                            type: object
                            properties:
                              content:
                                type: string
        "400":
          description: Missing required parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Tool execution failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Tool not directly supported via /call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /batch-read:
    post:
      tags: [tools]
      summary: Batch read files by glob patterns
      description: |
        Reads multiple files matching the given glob patterns. For each pattern,
        finds matching files and reads their contents. Results are returned as
        an array of file objects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patterns:
                  type: array
                  items:
                    type: string
                  default: []
                  description: Array of glob patterns (e.g. ["src/*.js", "**/*.md"])
                basePath:
                  type: string
                  description: Base directory for pattern resolution (defaults to DEFAULT_CWD)
      responses:
        "200":
          description: Batch read completed (individual files may have errors)
          content:
            application/json:
              schema:
                type: object
                required: [ok, files]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  files:
                    type: array
                    items:
                      type: object
                      required: [path, content]
                      properties:
                        path:
                          type: string
                          description: Absolute file path
                        content:
                          type: string
                          description: File content (empty string on error)
                        error:
                          type: string
                          description: Error message if the file could not be read
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
